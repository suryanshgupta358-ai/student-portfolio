<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portfolio | Contact</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fcfbf9;
            --card-bg: #ffffff;
            --text-main: #1a1a1a;
            --text-muted: #6b7280;
            --accent: #5a6b5c;
            --border-color: #e5e7eb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
        }

        nav {
            background: rgba(252, 251, 249, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 8%;
            border-bottom: 1px solid var(--border-color);
        }

        nav .logo {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 15px;
            background: #f3f4f6;
            padding: 6px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
        }

        nav ul li a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 6px 16px;
            border-radius: 20px;
            transition: all 0.2s ease;
            display: inline-block;
        }

        nav ul li a.active, nav ul li a:hover {
            background: #ffffff;
            color: var(--text-main);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .content-container {
            max-width: 900px;
            margin: 60px auto;
            padding: 0 30px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 45px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.02);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }

        p {
            color: var(--text-muted);
            font-size: 1.05ln;
            line-height: 1.7;
            margin-bottom: 15px;
        }

        .contact-info {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .contact-item {
            background: #fafafa;
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            font-size: 1rem;
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo"><span>✦</span> StudentVault</div>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </nav>

    <div class="content-container">
        <div class="card">
            <h1>Get in Touch</h1>
            <p>Have questions about this student portfolio system or want to connect? Reach out using the details below:</p>
            
            <div class="contact-info">
                <div class="contact-item">📧 <strong>Email:</strong> suryansh@college.edu</div>
                <div class="contact-item">📱 <strong>Mobile:</strong> +91 9876543210</div>
                <div class="contact-item">🏛️ <strong>Institution:</strong> KJU College</div>
            </div>
        </div>
    </div>

</body>
</html>
