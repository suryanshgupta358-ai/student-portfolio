<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portfolio | Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fcfbf9;
            --card-bg: #ffffff;
            --text-main: #1a1a1a;
            --text-muted: #6b7280;
            --accent: #5a6b5c;
            --accent-hover: #475449;
            --border-color: #e5e7eb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 60px;
        }

        /* Navbar */
        nav {
            background: rgba(252, 251, 249, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 8%;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        nav .logo {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 15px;
            background: #f3f4f6;
            padding: 6px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
        }

        nav ul li a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 6px 16px;
            border-radius: 20px;
            transition: all 0.2s ease;
            display: inline-block;
        }

        nav ul li a.active, nav ul li a:hover {
            background: #ffffff;
            color: var(--text-main);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 55px 20px 35px;
            max-width: 800px;
            margin: 0 auto;
        }

        .hero-badge {
            display: inline-block;
            background: #edf2ed;
            color: var(--accent);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 18px;
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -1px;
            line-height: 1.15;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Main Grid Layout */
        .container {
            max-width: 1280px;
            margin: 20px auto 0;
            padding: 0 30px;
            display: grid;
            grid-template-columns: 1fr 1.25fr;
            gap: 35px;
        }

        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.02);
            height: fit-content;
        }

        .card h2 {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 25px;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        /* Form Styles */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group.full-width {
            grid-column: span 2;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: var(--text-main);
            font-size: 0.88rem;
        }

        .input-group input, 
        .input-group select, 
        .input-group textarea {
            width: 100%;
            padding: 12px 16px;
            background: #fafafa;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-group input:focus, 
        .input-group select:focus, 
        .input-group textarea:focus {
            border-color: var(--accent);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(90, 107, 92, 0.1);
        }

        .input-group select[multiple] {
            height: 110px;
            background: #fafafa;
        }

        .helper-text {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(90, 107, 92, 0.2);
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        /* Student Grid Display */
        .student-grid {
            display: flex;
            flex-direction: column;
            gap: 18px;
            max-height: 750px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .student-card {
            background: #fafafa;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 22px;
            transition: all 0.2s ease;
        }

        .student-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            background: #fff;
        }

        .student-card h3 {
            color: var(--text-main);
            font-size: 1.15rem;
            font-weight: 600;
        }

        .student-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .student-card p strong {
            color: var(--text-main);
        }

        .skills-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
        }

        .skill-badge {
            background: #f3f4f6;
            color: #374151;
            border: 1px solid #e5e7eb;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo"><span>✦</span> StudentVault</div>
        <ul>
            <li><a href="index.html" class="active">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <div class="hero">
        <span class="hero-badge">✦ Student Credential System</span>
        <h1>Build & Manage Student Profiles</h1>
        <p>Register professional details and view enrolled portfolios instantly.</p>
    </div>

    <div class="container">
        <!-- Form Section -->
        <section class="card">
            <h2>Add Student Profile</h2>
            <form id="studentForm">
                <div class="form-grid">
                    <div class="input-group full-width">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" name="fullName" required placeholder="e.g., Suryansh Gupta">
                    </div>

                    <div class="input-group">
                        <label for="gender">Gender</label>
                        <select id="gender" name="gender" required>
                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="mobileNo">Mobile Number</label>
                        <input type="text" id="mobileNo" name="mobileNo" required placeholder="e.g., +91 9876543210">
                    </div>

                    <div class="input-group full-width">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" required placeholder="e.g., suryansh@gmail.com">
                    </div>

                    <div class="input-group">
                        <label for="course">Course / Degree</label>
                        <input type="text" id="course" name="course" required placeholder="e.g., BSc CS">
                    </div>

                    <div class="input-group">
                        <label for="college">College Name</label>
                        <input type="text" id="college" name="college" required placeholder="e.g., KJU">
                    </div>

                    <div class="input-group full-width">
                        <label for="about">About Yourself / Bio</label>
                        <textarea id="about" name="about" rows="2" placeholder="Write a short summary..."></textarea>
                    </div>

                    <div class="input-group full-width">
                        <label for="skills">Skills & Credentials</label>
                        <select id="skills" name="skills" multiple required>
                            <option value="Node.js">Node.js</option>
                            <option value="MongoDB">MongoDB</option>
                            <option value="SQL">SQL</option>
                            <option value="Data Structures">Data Structures</option>
                            <option value="Machine Learning">Machine Learning</option>
                            <option value="React">React</option>
                            <option value="Python">Python</option>
                            <option value="JavaScript">JavaScript</option>
                            <option value="HTML/CSS">HTML/CSS</option>
                        </select>
                        <div class="helper-text">💡 Hold Ctrl (or Cmd on Mac) to select multiple skills.</div>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Save & Publish Profile</button>
            </form>
        </section>

        <!-- Display Section -->
        <section class="card">
            <h2>Enrolled Portfolios</h2>
            <div id="studentList" class="student-grid">
                <!-- Dynamically loaded student cards will appear here -->
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
